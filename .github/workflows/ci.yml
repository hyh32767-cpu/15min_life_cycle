name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install API deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r api/requirements-dev.txt
      - name: Backend tests (no AK, hermetic)
        run: BAIDU_MAP_AK='' BAIDU_MAP_SK='' make api-test
      - name: Release scan
        run: .venv/bin/python tools/demo/scan_release.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: cd web && npm ci
      - name: Typecheck + lint + unit tests
        run: make web-check
      - name: Build
        run: make web-build
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: make web-e2e
