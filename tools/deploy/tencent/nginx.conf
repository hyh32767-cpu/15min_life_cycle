server {
    listen 80;
    server_name 82.156.242.155;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://82.156.242.155$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 82.156.242.155;
    ssl_certificate /etc/letsencrypt/live/82.156.242.155/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.156.242.155/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShunshouTLS:10m;
    ssl_session_timeout 1d;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
