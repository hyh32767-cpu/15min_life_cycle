function life(){const selected=catalog.filter(x=>s.services.includes(x[0])),f=service(s.focus),unknown=selected.some(x=>x[3]===null),avg=unknown?'—':Math.round(selected.reduce((a,x)=>a+x[3],0)/selected.length);return `<div class="analysis-head"><div class="row between"><span class="muted">🚶 步行生活圈</span>${btn('更换位置','search','','text small')}</div><div class="time">${[5,10,15,20].map(t=>btn(t+'分钟','time',t,t===s.time?'active':'')).join('')}</div><div class="status-line"><span>${s.ready?'✓ 当前步行范围':'◌ 正在更新步行范围…'}</span><span>交互示例</span></div></div><div class="card tint overview"><div class="coverage-ring"><b>${s.ready?avg:'…'}</b><small>平均覆盖${unknown?'待查明':' %'}</small></div><div><div class="row between"><h2>${esc(s.center.name)}</h2>${btn('☆','save-center','','text small')}</div><p>${esc(s.center.address)}</p><div class="row wrap"><span class="metric-badge">${selected.length}类关注服务</span><span class="metric-badge">${selected.filter(x=>x[3]!==null&&x[3]<70).length}类覆盖较低</span></div></div></div><div class="stack" style="gap:6px"><div class="row between"><span class="section-title">我的日常关注</span>${btn('调整服务 ›','services','','text small')}</div><div class="service-chips">${selected.map(x=>btn(x[1]+' '+x[2],'focus',x[0],x[0]===s.focus?'active':'quiet')).join('')}</div></div>${s.ready?`<div class="services">${selected.map(x=>`<button class="service ${s.focus===x[0]?'active':''}" data-action="focus" data-id="${x[0]}" data-status="${x[3]===null?'unknown':x[3]===0?'empty':'ready'}"><div class="row between"><b>${x[1]} ${x[2]}</b><strong>${x[3]===null?'待查明':x[3]+'%'}</strong></div><div class="bar"><i style="width:${x[3]||0}%"></i></div><small>${x[3]===null?'暂未取得可用结果':x[4]+'家参评 · '+(x[3]===0?'未找到可达设施':x[3]===100?'采样点均可达':'有未覆盖位置')}</small></button>`).join('')}</div><section class="suggest-box"><div class="row between"><h3>${f[1]} ${f[2]} · ${f[3]===null?'待查明':f[3]===0?'关注短板':f[3]===100?'附近可达':'还有提升空间'}</h3>${btn('报告 ›','report','','text small')}</div><p>${f[3]===null?'暂未取得可用结果，不能判断 function route(){return `<section class="card"><div class="route-line"><span class="route-dot"></span>${btn(esc(s.start.name),'endpoint','start')}${btn('⇅','reverse','','text')}</div><div class="route-line"><span class="route-dot end"></span>${btn(esc(s.end.name),'endpoint','end')}${btn('＋途经','add-stop','','text')}</div><div class="row between"><small>步行 · 18分钟 · 1.2公里</small>${btn('出发设置','settings','','text')}</div><div class="row wrap">${btn('我的地点','library','','small quiet')}${btn('我的路径','routes','','small quiet')}${btn('保存路径','save-route','','small text')}</div></section>${s.stops.length?`<section class="stack"><div class="row between"><h3>途经地点 <small>${s.stops.length}处</small></h3>${btn('调整顺序','order','','text')}</div>${s.stops.map((x,i)=>`<div class="row"><span class="number">${i+1}</span><div class="grow"><b>${esc(x.name)}</b><br><small>停留${x.stay}分钟${s.done.includes(i)?' · 已完成':''}</small></div>${btn('修改','edit-stop',i,'text')}</div>`).join('')}${s.plan?`<div class="card tint stack"><div class="row between"><b>${s.running?'行程进行中':'行程已安排'}</b><span class="pill">示例方案</span></div><h2>${s.running&&s.done.length===s.stops.length?'前往终点':s.running?'下一站 · '+esc(s.stops[s.done.length]?.name||s.end.name):'全程38分钟'}</h2><small>${s.running?'已完成 '+s.done.length+'/'+s.stops.length+' 处':'步行23分钟 · 停留15分钟 · 多走5分钟'}</small>${s.running?btn(s.done.length===s.stops.length?'结束行程':'办好了，下一站','complete','','primary'):btn('开始行程','start','','primary')}</div>`:`<div class="planbar"><div><b>${s.stops.length}个途经点</b><br><small>含停留时间，统一安排</small></div>${btn('安排路线','plan','','primary')}</div>`}</section>`:''}<div class="row between"><h3>沿途找服务</h3>${btn('沿途生活圈','band','','text')}</div><div class="row wrap">${['全部','药店','生鲜','快递'].map(x=>btn(x,'filter',x,x===s.filter?'active small':'small')).join('')}</div><div>${shops.filter(x=>s.filter==='全部'||s.filter===x.cat).map((x)=>`<div class="shop"><span class="shop-icon">${x.icon}</span><div class="grow"><b>${x.name}</b><div class="route-tag">多走${x. function drawMap(){window.previewMapDraw?.();const isRoute=s.mode==='route';$('rings').classList.toggle('hidden',isRoute||!s.ready);$('route-drawing').classList.toggle('hidden',!isRoute);$('rings').style.opacity=s.heat?'1':'.65';$('rings').querySelectorAll('path').forEach((p,i)=>p.style.display=s.heat||i===1?'':'none');const mobile=innerWidth<=820,cx=mobile?45:62,cy=mobile?31:49;const scale=Math.max(innerWidth/1400,innerHeight/950),mx=(innerWidth*cx/100+(1400*scale-innerWidth)/2)/scale,my=(innerHeight*cy/100+(950*scale-innerHeight)/2)/scale;$('rings').setAttribute('transform',`translate(${mx} ${my}) scale(${mobile?.62:1})`);$('route-drawing').setAttribute('transform',`translate(${mx-795} ${my-470})`);let marks=[`<button class="marker origin" style="left:${cx}%;top:${cy}%" data-action="center">📍 ${esc(isRoute?s.end.name:s.center.name)}</button>`];if(isRoute)marks.push(`<button class="marker" style="left:${cx-18}%;top:${cy+17}%" data-action="endpoint" data-id="start">● ${esc(s.start.name)}</button>`);if(s.pois&&(!isRoute?service(s.focus)[4]>0:true)){const f=service(s.focus);[0,1].forEach((x,i)=>marks.push(`<button class="marker" style="left:${cx+(i?-19:18)}%;top:${cy+(i?12:-11)}%" data-action="${isRoute?'add-shop':'poi'}" data-id="${i}">${isRoute?shops[i].icon+' '+shops[i].name:f[1]+' '+f[2]}</button>`))}if(s.blind)marks.push(`<button class="marker" style="left:${cx+8}%;top:${cy+10}%" data-action="suggestion">◌ 未覆盖位置</button>`);$('markers').innerHTML=marks.join('')}
