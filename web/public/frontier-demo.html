// 仅绘制时圆角：先合并共线细分点，再以最多25米的局部二次曲线衔接。
// 曲线留在相邻折线的凸包内，不用会向外过冲的样条；原始坐标不改。
function roundLine(coords){
  if(coords.length<3)return coords;
  const same=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])<.01;
  const closed=same(coords[0],coords.at(-1)),compact=[];
  for(const p of (closed?coords.slice(0,-1):coords)){
    if(compact.length&&same(compact.at(-1),p))continue;
    while(compact.length>=2){
      const a=compact.at(-2),b=compact.at(-1),dx=p[0]-a[0],dy=p[1]-a[1],length=Math.hypot(dx,dy);
      if(!length||Math.abs(dx*(b[1]-a[1])-dy*(b[0]-a[0]))/length>.25
        ||(b[0]-a[0])*(p[0]-b[0])+(b[1]-a[1])*(p[1]-b[1])<0)break;
      compact.pop();
    }
    compact.push(p);
  }
  if(compact.length<3)return coords;
  const result=[];
  for(let i=0;i<compact.length;i++){
    const p=compact[i];
    if(!closed&&(i===0||i===compact.length-1)){result.push(p);continue}
    const a=compact[(i-1+compact.length)%compact.length],b=compact[(i+1)%compact.length];
    const before=Math.hypot(a[0]-p[0],a[1]-p[1]),after=Math.hypot(b[0]-p[0],b[1]-p[1]);
    const distance=Math.min(25,before*.35,after*.35);

    const exit=[p[0]+(b[0]-p[0])*distance/after,p[1]+(b[1]-p[1])*distance/after];
    result.push(entry);
    for(let j=1;j<=8;j++){

}
